name: ERCOT Smoke Test (single day, should take seconds)
on:
  workflow_dispatch:
jobs:
  smoketest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install gridstatus pandas
      - name: Run smoke test
        run: python3 smoketest_ercot.py
